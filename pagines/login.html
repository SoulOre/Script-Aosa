<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M08-Aplicacions web UF2 - Login</title>
    <style>
        /* CSS Básico para centrar el contenido y simular el recuadro */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .login-container {
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .git-logo {
            max-width: 150px; /* Ajusta el tamaño de la imagen */
            height: auto;
            margin: 20px 0;
        }

        input[type="text"], input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ddd;
            box-sizing: border-box;
            text-align: center; /* Para centrar el texto dentro de los campos, como en el 'Write your user name here' */
        }

        button {
            padding: 8px 20px;
            cursor: pointer;
        }

        .title {
            margin-bottom: 25px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="title">
            **M08-Aplicacions web UF2**
        </div>

        <img src="/home/isard/script_aosa/imatges/login.png" alt="Logo de Git" class="git-logo">

        <form>
            <label for="username">User Name</label>
            <br>
            <input type="text" id="username" name="username" placeholder="Write your user name here">
            
            <label for="password">Password:</label>
            <br>
            <input type="password" id="password" name="password">
            
            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
